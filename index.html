<style>
  :root {
    --bg: #fbf6e9;
    --bg-card: #ffffff;
    --bg-card-hover: #fcf9f0;
    --bg-elevated: #f5efe0;
    --bg-soft: #f9f4e4;
    --border: #e2d8be;
    --border-soft: #ece3ce;
    --border-strong: #c8b890;
    --gold: #a87633;
    --gold-dim: #7c5722;
    --gold-soft: #c69f5e;
    --gold-pale: #efe2c0;
    --text: #2a2238;
    --text-strong: #14102a;
    --text-dim: #6b5d4a;
    --text-faint: #a39481;
    --mantra: #281a3a;
    --accent: #a87633;
    --shadow: rgba(85, 55, 20, 0.08);

    --sun: #d77a1f;
    --moon: #5d6d8f;
    --mars: #b03a2b;
    --mercury: #4a8758;
    --jupiter: #b07d28;
    --venus: #b16a8c;
    --saturn: #3d4d70;
    --rahu: #6e4faa;
    --ketu: #b85d35;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% 0%, #fdf9ec 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, #f3ead3 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 0% 100%, #f7eee0 0%, transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(env(safe-area-inset-top), 16px) 16px max(env(safe-area-inset-bottom), 32px);
    max-width: 520px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 18% 28%, rgba(168, 118, 51, 0.28), transparent),
      radial-gradient(1px 1px at 72% 22%, rgba(168, 118, 51, 0.22), transparent),
      radial-gradient(1.5px 1.5px at 42% 62%, rgba(168, 118, 51, 0.22), transparent),
      radial-gradient(1px 1px at 82% 72%, rgba(168, 118, 51, 0.26), transparent),
      radial-gradient(1px 1px at 14% 84%, rgba(168, 118, 51, 0.18), transparent),
      radial-gradient(1.5px 1.5px at 90% 44%, rgba(168, 118, 51, 0.22), transparent),
      radial-gradient(1px 1px at 52% 12%, rgba(168, 118, 51, 0.18), transparent),
      radial-gradient(1.5px 1.5px at 32% 78%, rgba(168, 118, 51, 0.22), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px 0 28px;
  }
  .header .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 6px;
    color: var(--gold);
  }
  .header .ornament span { flex: 0 0 auto; font-size: 18px; opacity: 0.7; }
  .header .ornament .line {
    flex: 1 1 auto;
    max-width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim), transparent);
  }
  .header h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.18em;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .header .date { font-size: 13px; color: var(--text-dim); letter-spacing: 0.06em; }
  .header .clock { font-size: 12px; color: var(--text-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .card {
    position: relative;
    z-index: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px var(--shadow);
  }

  .now-card { padding: 24px 20px 22px; overflow: hidden; }
  .now-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at top, rgba(168, 118, 51, 0.10), transparent 70%);
    pointer-events: none;
  }
  .now-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
    position: relative;
  }
  .now-status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
    animation: pulse 2s ease-in-out infinite;
  }
  .now-status.idle .dot { background: var(--text-faint); box-shadow: none; animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .now-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 28px;
    margin-bottom: 4px;
    color: var(--text);
    position: relative;
  }
  .now-title .planet-icon { font-size: 24px; margin-right: 8px; vertical-align: -2px; }
  .now-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; letter-spacing: 0.04em; position: relative; }

  .mantra-text {
    font-family: "Cormorant Garamond", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-style: italic;
    font-size: 23px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--mantra);
    margin: 16px 0 12px;
    letter-spacing: 0.005em;
    position: relative;
  }
  .mantra-reading {
    font-size: 16px;
    color: var(--text);
    line-height: 1.75;
    letter-spacing: 0.04em;
    position: relative;
  }
  .mantra-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: 16px 0;
    position: relative;
  }

  .now-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
    position: relative;
  }
  .meta-item { font-size: 12px; color: var(--text-dim); }
  .meta-item .label {
    color: var(--text-faint);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 10px;
    display: block;
    margin-bottom: 2px;
  }
  .meta-item .value {
    font-variant-numeric: tabular-nums;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
  }

  .progress {
    height: 3px;
    background: var(--border-soft);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 14px;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(to right, var(--gold-dim), var(--gold));
    border-radius: 2px;
    transition: width 1s linear;
  }

  .section-heading {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 4px 12px;
    color: var(--gold-dim);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .section-heading .line {
    flex: 1 1 auto;
    height: 1px;
    background: linear-gradient(to right, var(--border), transparent);
  }

  /* Counter */
  .counter-card {
    position: relative;
    z-index: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px 18px;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px var(--shadow);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .counter-card.glow {
    border-color: var(--gold-dim);
    box-shadow: 0 4px 24px var(--shadow), 0 0 20px rgba(168, 118, 51, 0.20);
  }
  .counter-reset {
    position: absolute;
    top: 12px;
    right: 12px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-faint);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }
  .counter-reset:hover, .counter-reset:active { color: var(--gold); border-color: var(--gold-dim); }
  .counter-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-right: 38px;
  }
  .counter-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--gold-dim);
    text-transform: uppercase;
    font-weight: 500;
  }
  .counter-target { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .counter-progress {
    height: 3px;
    background: var(--border-soft);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .counter-progress-bar {
    height: 100%;
    background: linear-gradient(to right, var(--gold-dim), var(--gold));
    border-radius: 2px;
    transition: width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .counter-tap-area {
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 16px 20px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
    transition: background 0.1s, transform 0.08s, border-color 0.2s;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .counter-tap-area:active {
    background: rgba(168, 118, 51, 0.10);
    transform: scale(0.985);
    border-color: var(--gold-dim);
  }
  .counter-display {
    font-family: "Cormorant Garamond", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 64px;
    font-weight: 400;
    line-height: 1;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    transition: transform 0.18s;
  }
  .counter-tap-area:active .counter-display { transform: scale(1.06); }
  .counter-display.celebrate { animation: celebrate 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes celebrate {
    0%   { transform: scale(1); text-shadow: 0 0 0 rgba(168, 118, 51, 0); }
    40%  { transform: scale(1.25); text-shadow: 0 0 20px rgba(168, 118, 51, 0.55); }
    100% { transform: scale(1); text-shadow: 0 0 0 rgba(168, 118, 51, 0); }
  }
  .counter-hint {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .counter-milestones {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 14px;
  }
  .milestone {
    flex: 1 1 0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 5px 0;
    border-radius: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text-faint);
    letter-spacing: 0.04em;
    transition: all 0.25s;
    text-align: center;
  }
  .milestone.reached {
    background: rgba(168, 118, 51, 0.12);
    border-color: var(--gold-dim);
    color: var(--gold);
  }
  .milestone.current {
    background: var(--gold);
    border-color: var(--gold);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 12px rgba(168, 118, 51, 0.20);
  }
  .milestone .check { margin-right: 4px; opacity: 0.8; }

  /* Timeline */
  .timeline { padding: 4px 0; }
  .slot {
    display: flex;
    align-items: stretch;
    gap: 14px;
    padding: 14px 4px;
    position: relative;
    border-radius: 10px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .slot:not(:last-child)::after {
    content: "";
    position: absolute;
    left: 32px;
    top: calc(14px + 38px);
    bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, var(--border) 50%, transparent);
  }
  .slot-marker {
    flex: 0 0 38px;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text-dim);
    position: relative;
    z-index: 1;
  }
  .slot.active .slot-marker {
    border-color: var(--gold);
    background: rgba(168, 118, 51, 0.12);
    color: var(--gold);
    box-shadow: 0 0 16px rgba(168, 118, 51, 0.32);
  }
  .slot.past .slot-marker { opacity: 0.4; }
  .slot.past .slot-content { opacity: 0.5; }
  .slot-content { flex: 1 1 auto; min-width: 0; }
  .slot-time {
    font-size: 13px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    margin-bottom: 2px;
    letter-spacing: 0.02em;
  }
  .slot.active .slot-time { color: var(--gold); font-weight: 500; }
  .slot-mantra {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    font-size: 17px;
    color: var(--text);
    margin-bottom: 2px;
  }
  .slot-note { font-size: 12px; color: var(--text-faint); }
  .slot-badge {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-elevated);
    color: var(--text-dim);
    border: 1px solid var(--border);
    margin-left: 6px;
    vertical-align: 1px;
    letter-spacing: 0.06em;
  }
  .slot.active .slot-badge {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
    font-weight: 600;
  }

  .sunset-info {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    letter-spacing: 0.04em;
  }
  .sunset-info .value { color: var(--text-dim); font-variant-numeric: tabular-nums; }

  /* Settings */
  .settings-card { padding: 4px 0; }
  .settings-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border-soft);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-icon {
    flex: 0 0 36px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--gold-dim);
  }
  .settings-main { flex: 1 1 auto; min-width: 0; }
  .settings-title { font-size: 14px; color: var(--text); margin-bottom: 2px; }
  .settings-sub { font-size: 11px; color: var(--text-faint); line-height: 1.4; }
  .settings-action { flex: 0 0 auto; }
  .toggle { position: relative; width: 46px; height: 26px; flex: 0 0 46px; }
  .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .toggle .slider::before {
    content: "";
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; top: 3px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider {
    background: rgba(168, 118, 51, 0.20);
    border-color: var(--gold-dim);
  }
  .toggle input:checked + .slider::before {
    transform: translateX(20px);
    background: var(--gold);
  }
  .test-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--gold-dim);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .test-btn:hover, .test-btn:active {
    background: rgba(168, 118, 51, 0.12);
    color: var(--gold);
  }
  .volume-row { padding: 4px 20px 12px; display: none; }
  .volume-row.show { display: flex; align-items: center; gap: 10px; }
  .volume-row label {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex: 0 0 auto;
  }
  .volume-row input[type="range"] {
    flex: 1 1 auto;
    accent-color: var(--gold);
    height: 4px;
  }
  .perm-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--bg-elevated);
    color: var(--text-dim);
    border: 1px solid var(--border);
    letter-spacing: 0.04em;
  }
  .perm-status.granted { color: var(--gold); border-color: var(--gold-dim); }
  .perm-status.denied { color: var(--mars); border-color: rgba(176, 58, 43, 0.5); }

  /* Install hint */
  .install-hint {
    background: var(--bg-card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 12px;
    color: var(--text-dim);
    margin: 16px 0;
    line-height: 1.7;
    display: none;
  }
  .install-hint.show { display: block; }
  .install-hint strong { color: var(--gold); font-weight: 500; }
  .install-hint .close {
    float: right;
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    margin: -4px -4px 0 0;
  }

  /* Reference */
  details.reference {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
  }
  details.reference > summary {
    list-style: none;
    cursor: pointer;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--gold-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    user-select: none;
  }
  details.reference > summary::-webkit-details-marker { display: none; }
  details.reference > summary::after {
    content: "▾";
    font-size: 14px;
    transition: transform 0.2s;
    color: var(--text-dim);
  }
  details.reference[open] > summary::after { transform: rotate(180deg); }

<script>
'use strict';

const PLANETS = [
  { weekday:'日曜日', weekdayShort:'日', weekdayEn:'SUN', planet:'太陽', sanskrit:'Surya', katakana:'スーリヤ', icon:'☉',
    mantra:'Om Hraam Hreem Hroum Sah Suryaya Namaha',

    kaalam:{start:[16,30], end:[18,0]} },
  { weekday:'月曜日', weekdayShort:'月', weekdayEn:'MON', planet:'月', sanskrit:'Chandra', katakana:'チャンドラ', icon:'☽',
    mantra:'Om Shraam Shreem Shroum Sah Chandraya Namaha',
    reading:'オーム シュラーム シュリーム シュローム サハ チャンドラーイェ ナマハ',
    kaalam:{start:[7,30], end:[9,0]} },
  { weekday:'火曜日', weekdayShort:'火', weekdayEn:'TUE', planet:'火星', sanskrit:'Mangal', katakana:'マンガル', icon:'♂',
    mantra:'Om Kraam Kreem Kroum Sah Bhaumaya Namaha',
    reading:'オーム クラーム クリーム クローム サハ バウマーイェ ナマハ',

  { weekday:'水曜日', weekdayShort:'水', weekdayEn:'WED', planet:'水星', sanskrit:'Budh', katakana:'ブダ', icon:'☿',
    mantra:'Om Braam Breem Broum Sah Buddhaya Namaha',
    reading:'オーム ブラーム ブリーム ブローム サハ ブダーイェ ナマハ',
    kaalam:{start:[12,0], end:[13,30]} },
  { weekday:'木曜日', weekdayShort:'木', weekdayEn:'THU', planet:'木星', sanskrit:'Guru', katakana:'グル', icon:'♃',
    mantra:'Om Graam Greem Groum Sah Gurave Namaha',
    reading:'オーム グラーム グリーム グローム サハ グラウェイ ナマハ',
    kaalam:{start:[13,30], end:[15,0]} },
  { weekday:'金曜日', weekdayShort:'金', weekdayEn:'FRI', planet:'金星', sanskrit:'Shukra', katakana:'シュクラ', icon:'♀',
    mantra:'Om Draam Dreem Droum Sah Shukraya Namaha',
    reading:'オーム ドラーム ドリーム ドローム サハ シュクラーイェ ナマハ',
    kaalam:{start:[10,30], end:[12,0]} },
  { weekday:'土曜日', weekdayShort:'土', weekdayEn:'SAT', planet:'土星', sanskrit:'Shani', katakana:'シャニ', icon:'♄',
    mantra:'Om Praam Preem Praum Sah Shanaishcharaya Namaha',
    reading:'オーム プラーム プリーム プロウム サハ シャナイシュチャラーイェ ナマハ',
    kaalam:{start:[9,0], end:[10,30]} },
];

const RAHU_KETU = {
  rahu: { name:'ラーフ', sanskrit:'Rahu', icon:'☊',
    mantra:'Om Bhraam Bhreem Bhraum Sah Rahave Namaha',
    reading:'オーム ブラーム ブリーム ブロウム サハ ラーハウェイ ナマハ' },
  ketu: { name:'ケートゥ', sanskrit:'Ketu', icon:'☋',
    mantra:'Om Sraam Sreem Sraum Sah Ketave Namaha',
    reading:'オーム スラーム スリーム スロウム サハ ケータウェイ ナマハ' },
};

const TOKYO = { lat: 35.6762, lng: 139.6503, timezone: 9 };
const MORNING_SLOT = { start: [8, 0], end: [9, 0] };

// Sunset calculation (NOAA-derived approximation)
function getDayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 0);
  const diff = date - start + ((start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000);
  return Math.floor(diff / 86400000);
}
function calculateSunset(date, lat, lng, timezone) {
  const N = getDayOfYear(date);
  const rad = Math.PI / 180;
  const gamma = 2 * Math.PI / 365 * (N - 1);
  const declination = (180/Math.PI) * (
    0.006918 - 0.399912*Math.cos(gamma) + 0.070257*Math.sin(gamma)
    - 0.006758*Math.cos(2*gamma) + 0.000907*Math.sin(2*gamma)
    - 0.002697*Math.cos(3*gamma) + 0.00148*Math.sin(3*gamma)
  );
  const eqTime = 229.18 * (
    0.000075 + 0.001868*Math.cos(gamma) - 0.032077*Math.sin(gamma)
    - 0.014615*Math.cos(2*gamma) - 0.040849*Math.sin(2*gamma)
  );
  const cosH = (Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(declination*rad))
    - Math.tan(lat*rad)*Math.tan(declination*rad));
  if (cosH > 1 || cosH < -1) return null;
  const H = Math.acos(cosH)/rad;
  const solarNoonUTC = 720 - 4*lng - eqTime;
  const sunsetUTC = solarNoonUTC + 4*H;
  return (sunsetUTC/60 + timezone + 24) % 24;
}
function decimalHoursToHM(h) {
  const totalMin = Math.round(h * 60);
  return [Math.floor(totalMin/60), totalMin%60];
}

function pad2(n) { return n.toString().padStart(2,'0'); }
function fmtTime([h,m]) { return `${pad2(h)}:${pad2(m)}`; }
function toMinutes([h,m]) { return h*60 + m; }
function minutesToHM(min) { min = ((min%1440)+1440)%1440; return [Math.floor(min/60), min%60]; }

function getTodaysSchedule(date) {
  const day = date.getDay();
  const planet = PLANETS[day];
  const sunsetHrs = calculateSunset(date, TOKYO.lat, TOKYO.lng, TOKYO.timezone);
  const sunsetHM = decimalHoursToHM(sunsetHrs);
  const sunsetMin = toMinutes(sunsetHM);
  const slots = [];
  slots.push({ type:'morning', label:'朝', icon:'☼',
    start: MORNING_SLOT.start, end: MORNING_SLOT.end,
    planet, mantra: planet.mantra, reading: planet.reading,
    name: planet.planet, sanskrit: planet.sanskrit });
  slots.push({ type:'kaalam', label:'カラム', icon:'☊',
    start: planet.kaalam.start, end: planet.kaalam.end,
    name:'ラーフ・ケートゥ', sanskrit:'Rahu & Ketu', isRahuKetu:true });
  slots.push({ type:'sunset', label:'日の入り', icon:'☾',
    start: minutesToHM(sunsetMin - 30), end: minutesToHM(sunsetMin + 30),
    planet, mantra: planet.mantra, reading: planet.reading,
    name: planet.planet, sanskrit: planet.sanskrit, sunsetHM });
  slots.sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
  return { slots, sunsetHM, planet };
}

function getCurrentState(date, schedule) {
  const nowMin = date.getHours()*60 + date.getMinutes() + date.getSeconds()/60;
  for (const slot of schedule.slots) {
    const startM = toMinutes(slot.start);
    const endM = toMinutes(slot.end);
    if (nowMin >= startM && nowMin < endM) {
      return { inSlot:true, slot, elapsedMin: nowMin - startM, totalMin: endM - startM, remainingMin: endM - nowMin };
    }
  }
  let next = null;
  let previous = null;
  for (const slot of schedule.slots) {
    if (toMinutes(slot.start) > nowMin) { next = slot; break; }
  }
  for (const slot of schedule.slots) {
    if (toMinutes(slot.end) <= nowMin) previous = slot;
  }
  return {
    inSlot:false,
    next,
    previous,
    untilMin: next ? toMinutes(next.start) - nowMin : null,
    sincePrevMin: previous ? nowMin - toMinutes(previous.end) : null,
  };
}

function renderHeader(date) {
  const planet = PLANETS[date.getDay()];
  document.getElementById('todayDate').textContent =

}
function renderClock(date) {
  document.getElementById('todayClock').textContent =
    `${pad2(date.getHours())}:${pad2(date.getMinutes())}:${pad2(date.getSeconds())}`;
}

function renderNowCard(state, schedule, date) {
  const el = document.getElementById('nowCard');
  if (state.inSlot) {
    const s = state.slot;
    const progress = Math.min(100, Math.max(0, (state.elapsedMin/state.totalMin)*100));
    const remH = Math.floor(state.remainingMin/60);
    const remM = Math.floor(state.remainingMin%60);

    if (s.isRahuKetu) {
      el.innerHTML = `
        <div class="now-status"><span class="dot"></span><span>カラム時間 — 今唱える</span></div>
        <div class="now-title"><span class="planet-icon">${RAHU_KETU.rahu.icon}</span>ラーフ & ケートゥ <span class="slot-badge">${fmtTime(s.start)}–${fmtTime(s.end)}</span></div>
        <div class="now-subtitle">Rahu & Ketu — このマントラはカラム時間にのみ唱えます</div>

          <div class="meta-item"><span class="label">残り時間</span><span class="value">${remTxt}</span></div>
          <div class="meta-item" style="text-align:right"><span class="label">終了</span><span class="value">${fmtTime(s.end)}</span></div>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="now-status"><span class="dot"></span><span>${s.label}の時間 — 今唱える</span></div>
        <div class="now-title"><span class="planet-icon">${s.planet.icon}</span>${s.name} <span class="slot-badge">${fmtTime(s.start)}–${fmtTime(s.end)}</span></div>
        <div class="now-subtitle">${s.sanskrit} / ${s.planet.katakana}</div>
        <div class="mantra-text">${s.mantra}</div>
        <div class="mantra-reading">${s.reading}</div>
        <div class="progress"><div class="progress-bar" style="width:${progress.toFixed(1)}%"></div></div>
        <div class="now-meta">
          <div class="meta-item"><span class="label">残り時間</span><span class="value">${remTxt}</span></div>
          <div class="meta-item" style="text-align:right"><span class="label">終了</span><span class="value">${fmtTime(s.end)}</span></div>
        </div>`;
    }
  } else if (state.previous && state.next) {
    // Between slots — keep the just-finished mantra visible at top, with next-up info below
    const p = state.previous;
    const n = state.next;
    const untilH = Math.floor(state.untilMin/60);
    const untilM = Math.floor(state.untilMin%60);
    const untilTxt = untilH>0 ? `${untilH}時間${pad2(untilM)}分後` : `${untilM}分後`;
    const nextLabel = n.isRahuKetu ? 'ラーフ・ケートゥ' : n.name;
    const nextIcon = n.isRahuKetu ? RAHU_KETU.rahu.icon : n.planet.icon;
    if (p.isRahuKetu) {
      el.innerHTML = `
        <div class="now-status idle"><span class="dot"></span><span>カラム時間(${fmtTime(p.start)}–${fmtTime(p.end)})— まだ唱えられます</span></div>
        <div class="now-title"><span class="planet-icon">${RAHU_KETU.rahu.icon}</span>ラーフ & ケートゥ</div>
        <div class="now-subtitle">Rahu & Ketu</div>
        <div class="mantra-text">${RAHU_KETU.rahu.mantra}</div>
        <div class="mantra-reading">${RAHU_KETU.rahu.reading}</div>
        <div class="mantra-divider"></div>
        <div class="mantra-text">${RAHU_KETU.ketu.mantra}</div>
        <div class="mantra-reading">${RAHU_KETU.ketu.reading}</div>
        <div class="mantra-divider"></div>
        <div class="now-meta">
          <div class="meta-item"><span class="label">次のマントラ</span><span class="value">${nextIcon} ${nextLabel} (${untilTxt})</span></div>
          <div class="meta-item" style="text-align:right"><span class="label">次の開始</span><span class="value">${fmtTime(n.start)}</span></div>
        </div>`;
    } else {
      el.innerHTML = `
        <div class="now-status idle"><span class="dot"></span><span>${p.label}の時間(${fmtTime(p.start)}–${fmtTime(p.end)})— まだ唱えられます</span></div>
        <div class="now-title"><span class="planet-icon">${p.planet.icon}</span>${p.name}</div>

          <div class="meta-item"><span class="label">次のマントラ</span><span class="value">${nextIcon} ${nextLabel} (${untilTxt})</span></div>
          <div class="meta-item" style="text-align:right"><span class="label">次の開始</span><span class="value">${fmtTime(n.start)}</span></div>
        </div>`;
    }
  } else if (state.next) {
    const n = state.next;
    const untilH = Math.floor(state.untilMin/60);
    const untilM = Math.floor(state.untilMin%60);
    const untilTxt = untilH>0 ? `${untilH}時間${pad2(untilM)}分後` : `${untilM}分後`;
    el.innerHTML = `
      <div class="now-status idle"><span class="dot"></span><span>次のマントラまで</span></div>
      <div class="now-title"><span class="planet-icon">${n.isRahuKetu?RAHU_KETU.rahu.icon:n.planet.icon}</span>${n.name} <span class="slot-badge">${fmtTime(n.start)}–${fmtTime(n.end)}</span></div>
      <div class="now-subtitle">${n.isRahuKetu?'カラム時間(ラーフ・ケートゥのみ)':`${n.sanskrit} — ${n.label}の時間`}</div>
      <div class="mantra-divider"></div>
      <div class="now-meta">
        <div class="meta-item"><span class="label">あと</span><span class="value">${untilTxt}</span></div>
        <div class="meta-item" style="text-align:right"><span class="label">開始</span><span class="value">${fmtTime(n.start)}</span></div>
      </div>`;
  } else if (state.previous) {
    // Today's slots are all done — still show the last mantra at the top
    const p = state.previous;
    const tomorrow = new Date(date); tomorrow.setDate(tomorrow.getDate()+1);
    const tp = PLANETS[tomorrow.getDay()];
    if (p.isRahuKetu) {
      el.innerHTML = `
        <div class="now-status idle"><span class="dot"></span><span>今日のマントラ時間は終了 — まだ唱えられます</span></div>
        <div class="now-title"><span class="planet-icon">${RAHU_KETU.rahu.icon}</span>ラーフ & ケートゥ</div>
        <div class="mantra-text">${RAHU_KETU.rahu.mantra}</div>
        <div class="mantra-reading">${RAHU_KETU.rahu.reading}</div>
        <div class="mantra-divider"></div>
        <div class="mantra-text">${RAHU_KETU.ketu.mantra}</div>
        <div class="mantra-reading">${RAHU_KETU.ketu.reading}</div>
        <div class="mantra-divider"></div>
        <div class="now-meta"><div class="meta-item"><span class="label">明日 朝の開始</span><span class="value">${fmtTime(MORNING_SLOT.start)} (${tp.planet})</span></div></div>`;
    } else {
      el.innerHTML = `
        <div class="now-status idle"><span class="dot"></span><span>今日のマントラ時間は終了 — まだ唱えられます</span></div>
        <div class="now-title"><span class="planet-icon">${p.planet.icon}</span>${p.name}</div>

    const tomorrow = new Date(date); tomorrow.setDate(tomorrow.getDate()+1);
    const tp = PLANETS[tomorrow.getDay()];
    el.innerHTML = `
      <div class="now-status idle"><span class="dot"></span><span>今日のマントラ時間は終了</span></div>
      <div class="now-title">明日：${tp.planet}</div>
      <div class="now-subtitle">${tp.sanskrit} / ${tp.weekday}</div>
      <div class="mantra-divider"></div>

  }
}

function renderTimeline(state, schedule, date) {
  const nowMin = date.getHours()*60 + date.getMinutes();
  const el = document.getElementById('timeline');
  let html = '';
  for (const s of schedule.slots) {
    const startM = toMinutes(s.start);
    const endM = toMinutes(s.end);
    let cls = '';
    if (nowMin >= startM && nowMin < endM) cls = 'active';
    else if (nowMin >= endM) cls = 'past';
    const name = s.isRahuKetu ? 'ラーフ・ケートゥ' : s.name;
    const note = s.isRahuKetu ? '※ カラム時間のみ唱える'
      : s.type==='morning' ? '朝のマントラ' : '日の入りのマントラ';
    const icon = s.isRahuKetu ? '☊' : (s.type==='morning' ? '☼' : '☾');
    const badge = cls==='active' ? `<span class="slot-badge">今</span>` : '';
    html += `<div class="slot ${cls}"><div class="slot-marker">${icon}</div>
      <div class="slot-content">
        <div class="slot-time">${fmtTime(s.start)} – ${fmtTime(s.end)}${badge}</div>
        <div class="slot-mantra">${name}</div>
        <div class="slot-note">${note}</div>
      </div></div>`;
  }
  html += `<div class="sunset-info"><span>本日の日の入り(東京)</span><span class="value">${fmtTime(schedule.sunsetHM)}</span></div>`;
  el.innerHTML = html;
}

function renderReference() {
  const el = document.getElementById('referenceList');
  let html = '';
  for (let i=0; i<7; i++) {
    const p = PLANETS[i];
    html += `<div class="ref-item">
      <div class="ref-header">
        <span class="ref-day">${p.weekdayEn}</span>
        <span class="ref-planet">${p.icon} ${p.planet}</span>
        <span class="ref-sanskrit">${p.sanskrit} / ${p.katakana}</span>
      </div>
      <div class="ref-mantra">${p.mantra}</div>
      <div class="ref-reading">${p.reading}</div>
      <div style="margin-top:6px"><span class="ref-time">カラム ${fmtTime(p.kaalam.start)}–${fmtTime(p.kaalam.end)}</span></div>
    </div>`;
  }
  for (const k of ['rahu','ketu']) {
    const r = RAHU_KETU[k];
    html += `<div class="ref-item special">
      <div class="ref-header">
        <span class="ref-day">カラム時間のみ</span>
        <span class="ref-planet">${r.icon} ${r.name}</span>
        <span class="ref-sanskrit">${r.sanskrit}</span>
      </div>
      <div class="ref-mantra">${r.mantra}</div>
      <div class="ref-reading">${r.reading}</div>
    </div>`;
  }
  el.innerHTML = html;
}

// Alerts
const SETTINGS_KEY = 'mantra-settings';
const ALERT_LOG_KEY = 'mantra-alert-log';
const defaultSettings = { soundEnabled: true, notifEnabled: false, volume: 0.6 };
function loadSettings() {
  try { return Object.assign({}, defaultSettings, JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')); }
  catch(e) { return Object.assign({}, defaultSettings); }
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
let settings = loadSettings();

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    audioCtx = new Ctor();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}

function playBell(volume) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const v = (volume==null ? settings.volume : volume);
  if (v <= 0) return;
  const master = ctx.createGain();
  master.gain.value = v;
  master.connect(ctx.destination);
  const strike = (startOffset, gainScale=1.0) => {
    const partials = [
      { freq: 523.25, gain: 0.32, decay: 4.5 },
      { freq: 1046.50, gain: 0.18, decay: 3.5 },
      { freq: 1568.00, gain: 0.10, decay: 2.5 },
      { freq: 2093.00, gain: 0.06, decay: 1.8 },
      { freq: 2637.02, gain: 0.04, decay: 1.2 },
    ];
    const t = now + startOffset;
    for (const p of partials) {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = p.freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(p.gain * gainScale, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p.decay);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + p.decay + 0.05);
    }
  };
  strike(0, 1.0);
  strike(2.0, 0.7);
}

function notifPermission() { return ('Notification' in window) ? Notification.permission : 'unsupported'; }
async function requestNotifPermission() {
  if (!('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'granted') return 'granted';
  if (Notification.permission === 'denied') return 'denied';
  try { return await Notification.requestPermission(); } catch(e) { return Notification.permission; }
}
function showNotification(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {
      body, tag:'mantra-alert',
      icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" fill="%23fdf6e2" rx="36"/><circle cx="70" cy="80" r="28" fill="%23d8842c"/><path d="M132 60a38 38 0 1 0 24 66 30 30 0 1 1-24-66" fill="%23a87633"/></svg>',
      silent: false,
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e) {}
}

function fireAlert(slot) {
  let title, body;
  if (slot.isRahuKetu) {
    title = '🔔 カラム時間 — ラーフ・ケートゥ';
    body = `${fmtTime(slot.start)}〜${fmtTime(slot.end)}\nOm Bhraam Bhreem Bhraum Sah Rahave Namaha / Om Sraam Sreem Sraum Sah Ketave Namaha`;
  } else {
    title = `🔔 ${slot.label}のマントラ — ${slot.name}`;
    body = `${fmtTime(slot.start)}〜${fmtTime(slot.end)}\n${slot.mantra}`;
  }
  if (settings.soundEnabled) playBell();
  if (settings.notifEnabled && notifPermission()==='granted') showNotification(title, body);
}

function getAlertLog() {
  try { return JSON.parse(localStorage.getItem(ALERT_LOG_KEY)||'{}'); }
  catch(e) { return {}; }
}
function setAlertLog(log) { localStorage.setItem(ALERT_LOG_KEY, JSON.stringify(log)); }
function todayKey(date) { return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`; }
function hasAlertedToday(date, slotType) {
  return (getAlertLog()[todayKey(date)] || []).includes(slotType);
}
function markAlertedToday(date, slotType) {
  const log = getAlertLog();
  const key = todayKey(date);
  for (const k of Object.keys(log)) if (k !== key) delete log[k];
  log[key] = Array.from(new Set([...(log[key]||[]), slotType]));
  setAlertLog(log);
}

// Counter
const COUNTER_KEY = 'mantra-counter';
const MILESTONES = [3, 9, 108];
function loadCounter() {
  try { const n = parseInt(localStorage.getItem(COUNTER_KEY)||'0',10); return isNaN(n)?0:Math.max(0,Math.min(108,n)); }
  catch(e) { return 0; }
}
function saveCounter(n) { localStorage.setItem(COUNTER_KEY, String(n)); }
let counter = loadCounter();

function getNextMilestone(c) {
  for (const m of MILESTONES) if (c < m) return m;
  return 108;
}

function renderCounter() {
  const display = document.getElementById('counterDisplay');
  const target = document.getElementById('counterTarget');
  const progressBar = document.getElementById('counterProgressBar');
  const msEls = { 3:document.getElementById('ms3'), 9:document.getElementById('ms9'), 108:document.getElementById('ms108') };
  display.textContent = counter;
  const next = getNextMilestone(counter);
  const prevMilestone = MILESTONES.filter(m => m < next).pop() || 0;
  const within = counter - prevMilestone;
  const span = next - prevMilestone;
  const pct = counter >= 108 ? 100 : Math.min(100, Math.max(0, (within/span)*100));
  progressBar.style.width = pct + '%';
  target.textContent = counter >= 108 ? '完了 ✦' : `次の目標 → ${next}`;
  for (const m of MILESTONES) {
    const el = msEls[m];
    el.classList.remove('reached','current');
    if (counter >= m) { el.classList.add('reached'); el.innerHTML = `<span class="check">✓</span>${m}`; }
    else { el.innerHTML = `${m}`; if (next===m) el.classList.add('current'); }
  }
}

function vibrate(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e) {} }
}

function playTing(freq, durationSec, gainScale) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const v = settings.volume * (gainScale==null ? 0.5 : gainScale);
  if (v <= 0) return;
  const osc = ctx.createOscillator();
  osc.type = 'sine'; osc.frequency.value = freq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(v*0.55, now+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, now+durationSec);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(now); osc.stop(now+durationSec+0.05);
}

function celebrateDisplay() {
  const display = document.getElementById('counterDisplay');
  display.classList.remove('celebrate');
  void display.offsetWidth;
  display.classList.add('celebrate');
}

function incrementCounter() {
  if (counter >= 108) { vibrate(8); return; }
  counter++;
  saveCounter(counter);
  vibrate(12);
  renderCounter();
  if (counter === 3) {
    celebrateDisplay();
    vibrate([0,25,40,25]);
    if (settings.soundEnabled) playTing(1318.51, 0.9, 0.45);
  } else if (counter === 9) {
    celebrateDisplay();
    vibrate([0,30,50,30,50,30]);
    if (settings.soundEnabled) {
      playTing(1318.51, 0.9, 0.5);
      setTimeout(()=>playTing(1760.00, 1.0, 0.5), 220);
    }
  } else if (counter === 108) {
    celebrateDisplay();
    vibrate([0,100,60,100,60,200]);
    if (settings.soundEnabled) playBell();
  }
}

function resetCounter() {
  if (counter === 0) return;
  if (!confirm(`カウンターを 0 にリセットしますか？(現在 ${counter} 回)`)) return;
  counter = 0; saveCounter(0); vibrate(8); renderCounter();
}

function bindCounter() {
  const tapBtn = document.getElementById('counterTap');
  let handled = false;
  if (window.PointerEvent) {
    tapBtn.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      handled = true;
      incrementCounter();
      e.preventDefault();
    });
    tapBtn.addEventListener('click', () => {
      if (handled) { handled = false; return; }
      incrementCounter();
    });
  } else {
    tapBtn.addEventListener('click', incrementCounter);
  }
  document.getElementById('counterReset').addEventListener('click', (e) => {
    e.stopPropagation(); resetCounter();
  });
  renderCounter();
}

function updateCounterGlow(inSlot) {
  const card = document.getElementById('counterCard');
  if (!card) return;
  card.classList.toggle('glow', !!inSlot);
}

// Tick
let lastDayKey = '';
let cachedSchedule = null;
let prevSlotType = null;
let firstTickDone = false;

function tick() {
  const now = new Date();
  const dayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
  if (dayKey !== lastDayKey || !cachedSchedule) {
    lastDayKey = dayKey;
    cachedSchedule = getTodaysSchedule(now);
    renderHeader(now);
    renderTimeline(getCurrentState(now, cachedSchedule), cachedSchedule, now);
  }
  const state = getCurrentState(now, cachedSchedule);
  renderClock(now);
  renderNowCard(state, cachedSchedule, now);
  updateCounterGlow(state.inSlot);
  if (now.getSeconds() === 0) renderTimeline(state, cachedSchedule, now);
  const currentSlotType = state.inSlot ? state.slot.type : null;
  if (currentSlotType && currentSlotType !== prevSlotType) {
    if (firstTickDone && !hasAlertedToday(now, currentSlotType)) {
      fireAlert(state.slot);
      markAlertedToday(now, currentSlotType);
    } else if (!firstTickDone) {
      markAlertedToday(now, currentSlotType);
    }
  }
  prevSlotType = currentSlotType;
  firstTickDone = true;
}

// Settings UI
function refreshNotifSub() {
  const el = document.getElementById('notifSub');
  const perm = notifPermission();
  if (perm === 'unsupported') el.innerHTML = 'このブラウザは通知に対応していません';
  else if (perm === 'granted') el.innerHTML = '画面外でも通知を表示します <span class="perm-status granted">許可済み</span>';
  else if (perm === 'denied') el.innerHTML = 'ブラウザ設定で通知がブロックされています <span class="perm-status denied">ブロック中</span>';
  else el.innerHTML = '画面外でも通知を表示します(タブを開いている間)';
}

function bindSettings() {
  const soundToggle = document.getElementById('soundToggle');
  const volumeRow = document.getElementById('volumeRow');
  const volumeSlider = document.getElementById('volumeSlider');
  const testBtn = document.getElementById('testBtn');
  const notifToggle = document.getElementById('notifToggle');
  soundToggle.checked = settings.soundEnabled;
  volumeSlider.value = Math.round(settings.volume*100);
  volumeRow.classList.toggle('show', settings.soundEnabled);
  notifToggle.checked = settings.notifEnabled && notifPermission()==='granted';
  refreshNotifSub();
  soundToggle.addEventListener('change', () => {
    settings.soundEnabled = soundToggle.checked;
    saveSettings(settings);
    volumeRow.classList.toggle('show', settings.soundEnabled);
    if (settings.soundEnabled) getAudioCtx();
  });
  volumeSlider.addEventListener('input', () => {
    settings.volume = parseInt(volumeSlider.value,10)/100;
    saveSettings(settings);
  });
  volumeSlider.addEventListener('change', () => playBell());
  testBtn.addEventListener('click', () => playBell());
  notifToggle.addEventListener('change', async () => {
    if (notifToggle.checked) {
      const result = await requestNotifPermission();
      if (result === 'granted') {
        settings.notifEnabled = true; saveSettings(settings);
        showNotification('🔔 通知が有効になりました', 'マントラの時間にお知らせします。');
      } else {
        notifToggle.checked = false; settings.notifEnabled = false; saveSettings(settings);
      }
      refreshNotifSub();
    } else {
      settings.notifEnabled = false; saveSettings(settings);
    }
  });
}

function showInstallHintIfNeeded() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone) return;
  if (localStorage.getItem('mantra-install-dismissed')) return;
  document.getElementById('installHint').classList.add('show');
  document.querySelector('#installHint .close').addEventListener('click', () => {
    localStorage.setItem('mantra-install-dismissed', '1');
  });
}

renderReference();
bindSettings();
bindCounter();
tick();
setInterval(tick, 1000);
showInstallHintIfNeeded();

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    refreshNotifSub();
    const notifToggle = document.getElementById('notifToggle');
    if (notifToggle && notifPermission() !== 'granted' && notifToggle.checked) {
      notifToggle.checked = false;
      settings.notifEnabled = false;
      saveSettings(settings);
    }
  }
});
</script>
